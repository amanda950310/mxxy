<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>累充礼包 - 梦想西游</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color: transparent;}
body{
    font-family:"Noto Serif SC";
    background:#08111f;
    color:#fff;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    position:relative;
}
body::before{
    content:"";
    position:fixed;
    top:0;left:0;width:100%;height:100%;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,213,106,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,213,106,0.06) 0%, transparent 40%),
        linear-gradient(180deg, #08111f 0%, #050a12 100%);
    z-index:-1;
}
a{text-decoration:none;color:#fff}
header{position:fixed;top:0;width:100%;height:70px;background:rgba(0,0,0,.65);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);z-index:999}
.nav{width:min(1300px,95%);margin:auto;display:flex;justify-content:space-between;align-items:center;height:70px}
.logo{font-size:30px;font-weight:bold;color:#ffd56a}
.menu{display:flex;gap:30px}
.menu a{transition:.3s;font-size:16px;font-weight:500}.menu a:hover{color:#ffd56a}
/* 汉堡按钮 */
.hamburger{display:none;width:32px;height:32px;position:relative;cursor:pointer}
.hamburger span{position:absolute;width:100%;height:3px;background:#ffd56a;left:0;transition:0.3s}
.hamburger span:nth-child(1){top:6px}
.hamburger span:nth-child(2){top:14px}
.hamburger span:nth-child(3){top:22px}
.mobile-menu{
    position:fixed;
    top:70px;
    left:0;
    width:100%;
    background:rgba(0,0,0,0.9);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    padding:20px;
    display:none;
    flex-direction:column;
    gap:16px;
    text-align:center;
    z-index:998;
    pointer-events:auto !important;
}
.mobile-menu a{
    font-size:18px;
    padding:8px 0;
    font-weight:500;
    cursor:pointer;
    touch-action: manipulation;
}

.wrap{width:min(1300px,94%);margin:0 auto;padding-top:100px;padding-bottom:80px}
.title{font-size:clamp(28px,6vw,48px);text-align:center;margin-bottom:50px;color:#ffd56a;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,0.6);}

/* 礼包区块 */
.block{
    background:rgba(8,17,31,0.85);
    border:1px solid rgba(255,213,106,0.35);
    border-radius:24px;
    padding:24px;
    margin-bottom:40px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    overflow:hidden;
}
.block h2{color:#ffd56a;margin-bottom:20px;font-size:clamp(22px,4vw,28px);text-align:center;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,0.5);}

.img-box{
    width:100%;
    overflow-x:auto;
    padding-bottom:10px;
    display:flex;
    justify-content:center;
}
.img-box img{
    display:block;
    width:100%;
    max-width:100%;
    border-radius:14px;
    cursor:pointer;
    object-fit:contain;
}
/* 美化滚动条 */
.img-box::-webkit-scrollbar{height:6px}
.img-box::-webkit-scrollbar-track{background:rgba(255,255,255,0.08);border-radius:4px}
.img-box::-webkit-scrollbar-thumb{background:#ffd56a;border-radius:4px}

.tips-text{
    text-align:center;
    font-size:15px;
    color:#cccccc;
    margin-top:12px;
}

footer{padding:40px 20px;text-align:center;background:rgba(5,10,18,0.9);color:#aaa;margin-top:40px;font-size:15px}
.star{position:fixed;width:2px;height:2px;background:#fff;animation:move 20s linear infinite}
@keyframes move{0%{transform:translateY(-100vh)}100%{transform:translateY(100vh)}}

/* 客服弹窗统一样式 */
.popup-mask{
    position:fixed;
    left:0;top:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.75);
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}
.popup-box{
    background:rgba(8,17,31,0.9);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,213,106,0.4);
    border-radius:16px;
    padding:40px 30px;
    text-align:center;
    width:100%;
    max-width:420px;
}
.popup-box h3{
    font-size:24px;
    color:#ffd56a;
    margin-bottom:20px;
    font-weight:700;
}
.popup-box .wx-text{
    font-size:20px;
    margin-bottom:30px;
    font-weight:500;
}
.popup-close{
    padding:12px 40px;
    background:rgba(212,166,79,0.35);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,213,106,0.4);
    border-radius:50px;
    display:inline-block;
    cursor:pointer;
    transition:0.3s;
    font-weight:500;
}
.popup-close:hover{
    background:rgba(245,208,107,0.45);
}

/* 图片全屏放大灯箱 */
.lightbox{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.92);
    z-index:10000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:8px;
}

@media(max-width:768px){
.menu{display:none}
.hamburger{display:block}
.wrap{padding-top:90px;}
}
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="logo">梦想西游</div>
    <div class="menu">
      <a href="index.html">首页</a>
      <a href="http://reg.czzdpb.com/?agent=KCES9N&mode=password" target="_blank">注册</a>
      <a href="welfare.html">福利中心</a>
      <a href="accumulate.html">累充礼包</a>
      <a href="https://down.czzdpb.com/" target="_blank">下载游戏</a>
      <a id="openService">客服中心</a>
    </div>
    <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
    </div>
  </div>
</header>
<div class="mobile-menu" id="mobileMenu">
    <a href="index.html">首页</a>
    <a href="http://reg.czzdpb.com/?agent=KCES9N&mode=password" target="_blank">注册</a>
    <a href="welfare.html">福利中心</a>
    <a href="accumulate.html">累充礼包</a>
    <a href="https://down.czzdpb.com/" target="_blank">下载游戏</a>
    <a id="openServiceMob">客服中心</a>
</div>

<!-- 客服弹窗 -->
<div class="popup-mask" id="serviceMask">
    <div class="popup-box">
        <h3>联系客服</h3>
        <div class="wx-text">客服微信号：lang03100</div>
        <div class="popup-close" id="closeService">关闭</div>
    </div>
</div>

<!-- 图片放大灯箱 -->
<div class="lightbox" id="lightbox">
    <img id="lightImg" src="">
</div>

<div class="wrap">
  <h1 class="title">累充礼包一览</h1>

  <div class="block">
    <h2>入门豪礼｜累充50~1000档位</h2>
    <div class="img-box">
        <img src="chongzhi1.jpg" alt="入门豪礼累充奖励" class="gift-img">
    </div>
    <div class="tips-text">📱 手机左右滑动查看完整奖励档位｜点击图片放大查看</div>
  </div>

  <div class="block">
    <h2>进阶神兽｜累充2000~10000档位</h2>
    <div class="img-box">
        <img src="chongzhi2.jpg" alt="进阶神兽累充奖励" class="gift-img">
    </div>
    <div class="tips-text">📱 手机左右滑动查看完整奖励档位｜点击图片放大查看</div>
  </div>

</div>

<footer>©2026 梦想西游 版权所有</footer>

<script>
const count=window.innerWidth<768?40:100;
for(let i=0;i<count;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.animationDuration=10+Math.random()*20+"s";
  document.body.appendChild(s);
}

//汉堡菜单
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');
hamburger.onclick = ()=>{
    mobileMenu.style.display = mobileMenu.style.display === "flex" ? "none" : "flex";
}
document.querySelectorAll('.mobile-menu a').forEach(link=>{
    link.addEventListener('click',()=>{
        mobileMenu.style.display = 'none';
    })
})

//客服弹窗统一逻辑
const mask = document.getElementById('serviceMask');
const openBtn = document.getElementById('openService');
const openBtnMob = document.getElementById('openServiceMob');
const closeBtn = document.getElementById('closeService');

function openPopup(){
    mask.style.display = 'flex';
    mobileMenu.style.display = "none";
}
openBtn.onclick = openPopup;
openBtnMob.onclick = openPopup;

closeBtn.onclick = function(){
    mask.style.display = 'none';
}
mask.onclick = function(e){
    if(e.target === mask){
        mask.style.display = 'none';
    }
}

//图片点击放大灯箱
const lightbox = document.getElementById('lightbox');
const lightImg = document.getElementById('lightImg');
document.querySelectorAll('.gift-img').forEach(img=>{
    img.onclick = function(){
        lightImg.src = this.src;
        lightbox.style.display = "flex";
    }
})
lightbox.onclick = function(){
    lightbox.style.display = "none";
}
</script>
</body>
</html>
